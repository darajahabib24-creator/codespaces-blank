name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Caching Buildozer dependencies drastically reduces future build times.
      # IMPORTANT: no restore-keys here — restoring an older cache mixes toolchain
      # artifacts (e.g. stale Python/openssl/NDK versions) into new builds.
      - name: Cache Buildozer Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v3-${{ hashFiles('buildozer.spec') }}

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf build-essential ccache cmake git libffi-dev \
            libncurses-dev libssl-dev libtinfo6 libtool pkg-config \
            unzip zlib1g-dev zip

      # Ubuntu 24.04's libtool (2.5.x) removed the LT_SYS_SYMBOL_USCORE macro,
      # which the pinned python-for-android's libffi recipe needs for
      # autoreconf. Install libtool 2.4.6 so 'autogen.sh' works.
      - name: Install libtool 2.4.6
        run: |
          curl -sL https://ftpmirror.gnu.org/libtool/libtool-2.4.6.tar.gz | tar xz -C /tmp
          cd /tmp/libtool-2.4.6 && ./configure --prefix=/usr/local >/dev/null && make -j"$(nproc)" >/dev/null && sudo make install >/dev/null
          libtool --version | head -1

      - name: Install Python Dependencies & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer Cython Kivy

      - name: Build Android Debug APK
        run: |
          # The 'yes |' automatically accepts the Android SDK license prompts
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-Android-Debug-APK
          path: bin/*.apk
          if-no-files-found: error
